{% extends "base.html" %}
{% block title %}Edit Query - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6 max-w-4xl">
    <h1 class="text-2xl font-bold mb-4">Edit Saved Query</h1>
    <form method="post" class="bg-gray-800 rounded-lg border border-gray-700 p-6 space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div>
            <label class="block text-sm text-gray-400 mb-2">Name</label>
            {{ form.name }}
        </div>
        <div>
            <label class="block text-sm text-gray-400 mb-2">Description</label>
            {{ form.description }}
        </div>
        <div>
            <label class="block text-sm text-gray-400 mb-2">SQL</label>
            {{ form.raw_sql }}
        </div>
        <div class="grid gap-4 md:grid-cols-2">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Tag</label>
                {{ form.tag }}
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">Category</label>
                {{ form.category }}
            </div>
        </div>
        <div>
            <label class="block text-sm text-gray-400 mb-2">Visibility</label>
            {{ form.visibility }}
        </div>
        <div class="flex gap-2">
            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">Save Changes</button>
            <a href="{% url 'query_builder:saved' %}" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
