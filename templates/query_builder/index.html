{% extends "base.html" %}
{% block title %}Query Builder - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6">
    <h1 class="text-2xl font-bold mb-4">Query Builder</h1>
    <div class="bg-gray-800 rounded-lg border border-gray-700 p-4 mb-4">
        <textarea id="sql-input" rows="4" class="w-full bg-gray-900 text-white border border-gray-600 rounded p-3 font-mono text-sm" placeholder="SELECT * FROM my_table WHERE id = 1;"></textarea>
        <div class="mt-3 flex gap-2">
            <button onclick="executeQuery()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded">Execute</button>
            <button onclick="saveQuery()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">Save Query</button>
        </div>
    </div>
    <div id="results-area" class="bg-gray-800 rounded-lg border border-gray-700 p-4">
        <p class="text-gray-500 text-sm">Run a query to see results here.</p>
    </div>
</div>
<script>
function executeQuery() {
    const sql = document.getElementById('sql-input').value;
    fetch("{% url 'query_builder:execute_api' %}", {
        method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
        body: JSON.stringify({sql: sql})
    }).then(r => r.json()).then(d => {
        const area = document.getElementById('results-area');
        if (d.rows && d.rows.length) {
            const cols = d.columns || [];
            area.innerHTML = `<div class="text-sm text-gray-400 mb-2">${d.row_count} rows in ${d.execution_time}s</div>
                <table class="w-full text-sm"><thead class="bg-gray-700"><tr>${cols.map(c=>`<th class="px-3 py-2 text-left">${c}</th>`).join('')}</tr></thead>
                <tbody class="divide-y divide-gray-700">${d.rows.map(r=>`<tr>${r.map(v=>`<td class="px-3 py-2">${v==null?'NULL':v}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>`;
        } else { area.innerHTML = `<p class="${d.error?'text-red-400':'text-green-400'}">${d.error||'No rows returned.'}</p>`; }
    });
}
function saveQuery() { alert('Save functionality coming soon!'); }
</script>
{% endblock %}
