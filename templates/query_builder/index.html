{% extends "base.html" %}
{% block title %}Query Builder - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6">
    <div class="flex items-center justify-between mb-4">
        <div>
            <h1 class="text-2xl font-bold">Query Builder</h1>
            <p class="text-gray-400">Run SQL against your configured database connections and save reusable queries.</p>
        </div>
        <a href="{% url 'query_builder:create' %}" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">New Saved Query</a>
    </div>

    <div class="bg-gray-800 rounded-lg border border-gray-700 p-4 mb-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm text-gray-400 mb-2">Connection</label>
                <select id="connection-select" class="w-full rounded border border-gray-700 bg-gray-900 text-white px-3 py-2">
                    {% for conn in connections %}
                    <option value="{{ conn.pk }}">{{ conn.name }} ({{ conn.get_engine_display }})</option>
                    {% empty %}
                    <option value="">No active connections</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">Saved Query</label>
                <select id="saved-query-select" class="w-full rounded border border-gray-700 bg-gray-900 text-white px-3 py-2" onchange="loadSavedQuery(this)">
                    <option value="">Select saved query</option>
                    {% for query in saved_queries %}
                    <option value="{{ query.pk }}" data-sql="{{ query.raw_sql|escapejs }}">{{ query.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <label class="block text-sm text-gray-400 mb-2">SQL Query</label>
        <textarea id="sql-input" rows="6" class="w-full bg-gray-900 text-white border border-gray-600 rounded p-3 font-mono text-sm" placeholder="SELECT * FROM my_table WHERE id = 1;">{{ sql|default:'' }}</textarea>
        <div class="mt-4 flex flex-wrap gap-2">
            <button onclick="executeQuery()" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded">Execute</button>
            <button onclick="saveQuery()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">Save Query</button>
            <a href="{% url 'query_builder:history' %}" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded">Query History</a>
        </div>
    </div>

    <div id="results-area" class="bg-gray-800 rounded-lg border border-gray-700 p-4">
        <p class="text-gray-500 text-sm">Run a query to see results here.</p>
    </div>
</div>
<script>
const csrftoken = '{{ csrf_token }}';

function executeQuery() {
    const sql = document.getElementById('sql-input').value;
    const connectionId = document.getElementById('connection-select').value;
    if (!connectionId) {
        alert('Please select a database connection first.');
        return;
    }

    fetch('{% url 'query_builder:execute_api' %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrftoken,
        },
        body: JSON.stringify({ sql: sql, connection_id: connectionId })
    }).then(r => r.json()).then(d => {
        const area = document.getElementById('results-area');
        if (d.error) {
            area.innerHTML = `<p class="text-red-400">${d.error}</p>`;
            return;
        }
        if (d.rows && d.rows.length) {
            const cols = d.columns || [];
            area.innerHTML = `<div class="text-sm text-gray-400 mb-2">${d.row_count} rows in ${d.execution_time}s</div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-700"><tr>${cols.map(c => `<th class="px-3 py-2 text-left">${c}</th>`).join('')}</tr></thead>
                        <tbody class="divide-y divide-gray-700">${d.rows.map(row => `<tr>${row.map(cell => `<td class="px-3 py-2">${cell === null ? 'NULL' : cell}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>
                </div>`;
        } else {
            area.innerHTML = `<p class="text-green-400">No rows returned.</p>`;
        }
    });
}

function saveQuery() {
    const connectionId = document.getElementById('connection-select').value;
    if (!connectionId) {
        alert('Select a connection before saving a query.');
        return;
    }
    window.location.href = '{% url 'query_builder:create' %}';
}

function loadSavedQuery(select) {
    const selected = select.options[select.selectedIndex];
    document.getElementById('sql-input').value = selected.dataset.sql || '';
}
</script>
{% endblock %}
