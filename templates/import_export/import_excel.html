{% extends "base.html" %}
{% block title %}Import Excel - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6 max-w-4xl">
    <h1 class="text-2xl font-bold mb-4">Import Excel</h1>
    <form method="post" enctype="multipart/form-data" class="bg-gray-800 rounded-lg border border-gray-700 p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm text-gray-400 mb-1">Select Excel File</label>
            <input type="file" name="excel_file" accept=".xlsx,.xls,.csv" class="w-full text-sm text-gray-300" required>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded">Upload & Preview</button>
    </form>
</div>
{% endblock %}
