{% extends "base.html" %}
{% block title %}Excel to SQL Converter - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6 max-w-4xl">
    <h1 class="text-2xl font-bold mb-4">Excel to SQL Converter</h1>
    <form method="post" enctype="multipart/form-data" class="bg-gray-800 rounded-lg border border-gray-700 p-6 space-y-4">
        {% csrf_token %}
        <div><label class="block text-sm text-gray-400 mb-1">Excel File</label>
            <input type="file" name="excel_file" accept=".xlsx,.xls,.csv" class="w-full text-sm text-gray-300" required>
        </div>
        <div><label class="block text-sm text-gray-400 mb-1">Target Table Name</label>
            <input type="text" name="table_name" value="my_table" class="w-full bg-gray-900 text-white border border-gray-600 rounded p-2">
        </div>
        <button type="submit" class="bg-yellow-600 hover:bg-yellow-500 text-white px-4 py-2 rounded">Convert to SQL</button>
    </form>
</div>
{% endblock %}
