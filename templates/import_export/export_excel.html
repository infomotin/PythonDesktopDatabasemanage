{% extends "base.html" %}
{% block title %}Export Excel - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6 max-w-4xl">
    <h1 class="text-2xl font-bold mb-4">Export Excel</h1>
    <p class="text-gray-400 mb-4">Run a SQL query and export results to Excel.</p>
    <form method="post" class="bg-gray-800 rounded-lg border border-gray-700 p-6 space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm text-gray-400 mb-1">SQL Query</label>
            <textarea name="sql" rows="5" class="w-full bg-gray-900 text-white border border-gray-600 rounded p-3 font-mono text-sm" placeholder="SELECT * FROM my_table LIMIT 100;"></textarea>
        </div>
        <button type="submit" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded">Export to Excel</button>
    </form>
</div>
{% endblock %}
