{% extends "base.html" %}
{% block title %}Database Confirm Delete - DBMS Pro{% endblock %}
{% block content %}
<div class="p-6 max-w-xl">
    <h1 class="text-2xl font-bold mb-4">Delete Database</h1>
    <p class="text-gray-400 mb-4">Are you sure you want to delete <strong>{{ database.name }}</strong>? This cannot be undone.</p>
    <form method="post" class="space-x-2">
        {% csrf_token %}
        <button class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded">Confirm Delete</button>
        <a href="{% url 'databases:list' %}" class="text-gray-400 hover:text-white">Cancel</a>
    </form>
</div>
{% endblock %}
